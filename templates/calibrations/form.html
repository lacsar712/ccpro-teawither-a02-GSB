{% extends "base.html" %}
{% block title %}新建风道标定票{% endblock %}
{% block content %}
<div class="page-header">
  <h1>新建风道标定票</h1>
  <a class="btn btn-secondary" href="{% url 'calibration_list' %}">返回列表</a>
</div>
<div class="card">
  <form method="post" class="form-grid">
    {% csrf_token %}
    {% for field in form %}
    <div class="form-row">
      <label for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {{ field.errors }}
    </div>
    {% endfor %}
    {{ form.non_field_errors }}
    <p class="muted">风速读数必须为正数；同园同一自然日仅允许一张标定票。</p>
    <button class="btn" type="submit">保存</button>
  </form>
</div>
{% endblock %}
